.f{transform-origin:50% 50%;will-change:transform,opacity,filter}

.chips{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px}

.chip{padding:18px 34px;border-radius:999px;border:2px solid rgba(139,147,232,.5);background:rgba(94,106,210,.22);font-weight:600;font-size:34px;color:var(--as);white-space:nowrap}

.dot{flex:none;width:44px;height:44px;border-radius:50%;border:4px solid #5a5e66;position:relative;transition:none}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.on:after{content:"";position:absolute;left:12px;top:5px;width:11px;height:20px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg)}
.row.done .tx{color:#5a5e66;text-decoration:line-through}
.caret:after{content:"";display:inline-block;width:5px;height:1em;margin-left:4px;vertical-align:-.12em;background:var(--at)}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;justify-content:center;padding:14px;z-index:9}
#ui button{font:600 15px Inter;border:0;border-radius:10px;padding:10px 18px;background:#5e6ad2;color:#fff;cursor:pointer}
#ui .b2{background:#22232b;color:#c8cad2}
#bar{position:fixed;left:0;top:0;height:4px;background:#8b93e8;width:0;z-index:9}
body.render #ui,body.render #bar{display:none}

}[LANG];

const E={lin:p=>p,out:p=>1-Math.pow(1-p,4),expo:p=>p>=1?1:1-Math.pow(2,-10*p),back:p=>{const c=2.1,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2)},io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};

// glow pulses
const glow=$('glow');
function seek(t){
 for(const [el,m] of reg){
  const st={...DEF};
  for(const k in m){
   const L=m[k];let v=L[0].f!==undefined?L[0].f:DEF[k];
   let prev=v;
   for(const tt of L){
    if(t<tt.t0){break}
    const from=tt.f!==undefined?tt.f:prev;
    const p=Math.min(1,Math.max(0,(t-tt.t0)/tt.d));
    v=from+(tt.to-from)*tt.e(p);prev=tt.to;
    if(p<1)break;
   }
   st[k]=v;
  }
  el.style.opacity=st.o;
  el.style.transform=`translate(${st.x}px,${st.y}px) rotate(${st.r}deg) scale(${st.sx*st.s},${st.s})`;
  el.style.filter=st.b>.05?`blur(${st.b}px)`:'';
 }
 for(const x of texts){const n=Math.max(0,Math.min(x.text.length,Math.floor((t-x.t0)*x.cps)));x.el.textContent=x.text.slice(0,n);
  x.el.classList.toggle('caret',t>=x.t0&&n<x.text.length||(t>=x.t0&&n===x.text.length&&t-x.t0<x.text.length/x.cps+.6&&Math.floor(t*3)%2===0))}
 for(const c of checks){const on=t>=c.t;c.el.classList.toggle('done',on);c.el.querySelector('.dot').classList.toggle('on',on)}
 const bp=(t%BEAT)/BEAT;const pulse=t>=4&&t<36?Math.exp(-bp*5):0;
 glow.style.opacity=t<1?t:1;glow.style.transform=`scale(${1+.035*pulse})`;
 // S5 results only after the line is typed
 $('s7ring').style.display=(t>29.4&&t<30.4)?'':'none';
}
window.seek=seek;window.DUR=DUR;

addEventListener('resize',fit);fit();
let playing=false,t0=0;const au=$('au');
function loop(){if(!playing)return;const t=au.currentTime;seek(t);$('bar').style.width=(t/DUR*100)+'%';if(t>=DUR-.02){playing=false;$('play').textContent='▶ Play';return}requestAnimationFrame(loop)}
$('play').onclick=()=>{if(playing){au.pause();playing=false;$('play').textContent='▶ Play';return}if(au.currentTime>=DUR-.1)au.currentTime=0;au.play();playing=true;$('play').textContent='❚❚ Pause';loop()};
